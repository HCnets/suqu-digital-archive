services:
  mysql:
    image: mysql:8.4
    container_name: szht-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: szht_cms
      MYSQL_USER: szht_user
      MYSQL_PASSWORD: szht_dev_password
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - szht-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot_dev_password --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  szht-mysql-data:
